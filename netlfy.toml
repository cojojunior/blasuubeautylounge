[build]
  command = "npm run build"
  publish = "dist"

# Tell the browser to NEVER cache the index.html file
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Tell the browser to NEVER cache the root route
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"