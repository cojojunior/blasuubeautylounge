[build]
  command = "npm run build"
  publish = "dist"

# 1. Serve the Service Worker
[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200
  force = false

# 2. EXCLUDE the assets folder from the SPA fallback
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = false

# 3. Catch-all for React Router (No "force = true" here!)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200