[build]
  command = "npm run build"
  publish = "dist"

# 1. Force correct MIME type for JS files
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

# 2. CRITICAL: Tell the browser to NEVER cache the index.html file
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# 3. SPA Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200