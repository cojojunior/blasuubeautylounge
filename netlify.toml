[build]
  command = "npm run build"
  publish = "dist"

# 1. Serve the Service Worker as a JavaScript file
[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200
  force = false

# 2. Serve actual files (JS, CSS, images) directly if they exist
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = false

# 3. Fallback all other routes to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200